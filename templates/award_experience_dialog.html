<fieldset>
<legend>{{localize "award-xp.group-xp"}}</legend>
<div class="award-xp-form">
	<div class="award-xp-primary"><label for="xp"></label><input id="award-xp-xp" type="text" name="xp"/></div>
	{{#if secondaryName}}
		<div class="award-xp-secondary"><input type="text" name="secondary-xp" placeholder={{secondaryName}} id="award-xp-secondary-xp"/></div>
	{{/if}}
</div>
</fieldset>
<fieldset>
<legend>{{localize "award-xp.characters"}}</legend>
<div class="award-xp-char-list">
	{{#each characters}}
		<div>
			<div><input class="award-xp-char-selector" type="checkbox" name="{{this.id}}" checked/></div>
			<div class="award-xp-char-img-box"><img src="{{this.image}}"/></div>
			<div>{{this.name}}</div>
			{{#if ../showSoloXp}}
				<div><input class="award-xp-solo" type="text" name="xp{{this.id}}" placeholder="{{localize "award-xp.bonus-xp-placeholder"}}"/></div>
			{{/if}}
		</div>
	{{/each}}
</div>
</fieldset>
